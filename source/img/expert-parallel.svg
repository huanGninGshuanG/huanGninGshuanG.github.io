<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f77b4"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#222">MoE 专家并行（EP）示意</text>
  <text x="20" y="52" font-size="13" fill="#555">稠密层（Attention / 共享 FFN）继续做 TP / PP；只有 MoE 专家层按 EP 把专家分布到不同 GPU，Token 由 Router 按需路由</text>

  <!-- Token 输入 -->
  <text x="75" y="96" font-size="12" fill="#333" text-anchor="middle">输入 Token</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="40" y="110" width="70" height="26" fill="#eef2f7" stroke="#667" stroke-width="1.2"/>
    <text x="75" y="123" dominant-baseline="central">Token 1</text>
    <rect x="40" y="146" width="70" height="26" fill="#eef2f7" stroke="#667" stroke-width="1.2"/>
    <text x="75" y="159" dominant-baseline="central">Token 2</text>
    <rect x="40" y="182" width="70" height="26" fill="#eef2f7" stroke="#667" stroke-width="1.2"/>
    <text x="75" y="195" dominant-baseline="central">Token 3</text>
    <rect x="40" y="218" width="70" height="26" fill="#eef2f7" stroke="#667" stroke-width="1.2"/>
    <text x="75" y="231" dominant-baseline="central">Token 4</text>
    <rect x="40" y="254" width="70" height="26" fill="#eef2f7" stroke="#667" stroke-width="1.2"/>
    <text x="75" y="267" dominant-baseline="central">Token 5</text>
    <rect x="40" y="290" width="70" height="26" fill="#eef2f7" stroke="#667" stroke-width="1.2"/>
    <text x="75" y="303" dominant-baseline="central">Token 6</text>
    <rect x="40" y="326" width="70" height="26" fill="#eef2f7" stroke="#667" stroke-width="1.2"/>
    <text x="75" y="339" dominant-baseline="central">Token 7</text>
    <rect x="40" y="362" width="70" height="26" fill="#eef2f7" stroke="#667" stroke-width="1.2"/>
    <text x="75" y="375" dominant-baseline="central">Token 8</text>
  </g>

  <!-- Router -->
  <rect x="200" y="196" width="120" height="88" rx="12" fill="#fff7e6" stroke="#d99a3d" stroke-width="2"/>
  <text x="260" y="236" font-size="13" font-weight="bold" fill="#8a5a10" text-anchor="middle">门控网络</text>
  <text x="260" y="256" font-size="11" fill="#8a5a10" text-anchor="middle">Router · top-k</text>

  <!-- EP 组 GPU -->
  <text x="617" y="84" font-size="12.5" fill="#333" text-anchor="middle">EP 组：8 张卡，每卡承载一个专家</text>
  <g font-size="12" fill="#fff" text-anchor="middle">
    <rect x="560" y="96"  width="115" height="34" fill="#4a7fb5" stroke="#2d5a86" stroke-width="1.5"/>
    <text x="617" y="113" dominant-baseline="central">GPU1 · E1</text>
    <rect x="560" y="136" width="115" height="34" fill="#4a7fb5" stroke="#2d5a86" stroke-width="1.5"/>
    <text x="617" y="153" dominant-baseline="central">GPU2 · E2</text>
    <rect x="560" y="176" width="115" height="34" fill="#4a7fb5" stroke="#2d5a86" stroke-width="1.5"/>
    <text x="617" y="193" dominant-baseline="central">GPU3 · E3</text>
    <rect x="560" y="216" width="115" height="34" fill="#4a7fb5" stroke="#2d5a86" stroke-width="1.5"/>
    <text x="617" y="233" dominant-baseline="central">GPU4 · E4</text>
    <rect x="560" y="256" width="115" height="34" fill="#4a7fb5" stroke="#2d5a86" stroke-width="1.5"/>
    <text x="617" y="273" dominant-baseline="central">GPU5 · E5</text>
    <rect x="560" y="296" width="115" height="34" fill="#4a7fb5" stroke="#2d5a86" stroke-width="1.5"/>
    <text x="617" y="313" dominant-baseline="central">GPU6 · E6</text>
    <rect x="560" y="336" width="115" height="34" fill="#4a7fb5" stroke="#2d5a86" stroke-width="1.5"/>
    <text x="617" y="353" dominant-baseline="central">GPU7 · E7</text>
    <rect x="560" y="376" width="115" height="34" fill="#4a7fb5" stroke="#2d5a86" stroke-width="1.5"/>
    <text x="617" y="393" dominant-baseline="central">GPU8 · E8</text>
  </g>

  <!-- Token → Router -->
  <g stroke="#999" stroke-width="1.2" marker-end="url(#arr)">
    <line x1="110" y1="123" x2="200" y2="222"/>
    <line x1="110" y1="159" x2="200" y2="228"/>
    <line x1="110" y1="195" x2="200" y2="234"/>
    <line x1="110" y1="231" x2="200" y2="240"/>
    <line x1="110" y1="267" x2="200" y2="246"/>
    <line x1="110" y1="303" x2="200" y2="252"/>
    <line x1="110" y1="339" x2="200" y2="258"/>
    <line x1="110" y1="375" x2="200" y2="264"/>
  </g>

  <!-- Router → GPU（普通路由） -->
  <g stroke="#999" stroke-width="1.2" marker-end="url(#arr)">
    <line x1="320" y1="222" x2="560" y2="113"/>
    <line x1="320" y1="228" x2="560" y2="153"/>
    <line x1="320" y1="246" x2="560" y2="273"/>
    <line x1="320" y1="252" x2="560" y2="313"/>
    <line x1="320" y1="258" x2="560" y2="353"/>
    <line x1="320" y1="264" x2="560" y2="393"/>
  </g>

  <!-- 高亮：Token 3 的 top-2 路由 -->
  <line x1="110" y1="195" x2="200" y2="234" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#arrB)"/>
  <line x1="320" y1="234" x2="560" y2="153" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#arrB)"/>
  <line x1="320" y1="234" x2="560" y2="353" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="428" y="222" font-size="12.5" font-weight="bold" fill="#1f77b4" text-anchor="middle">top-2 路由</text>

  <!-- 底部说明 -->
  <text x="20" y="430" font-size="13" fill="#333">通信：Router 决定后，Token 与其专家所在卡之间做 All-to-All 交换；负载均衡由 top-k 选择 + 辅助损失（aux loss）控制。</text>
  <text x="20" y="452" font-size="13" fill="#333">EP 把远超单卡容量的专家参数量摊到多卡，专家总数可远大于 GPU 数（每卡可承载多个专家分片）。</text>
</svg>
